<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mnsx</title>
    <link rel="stylesheet" href="styles.css">
    <script src="high-contrast.js"></script>
    <script>document.documentElement.classList.add('is-loading');</script>
    <style>
        .contact-title {
            font-family: var(--font-akira);
            font-size: clamp(1.5rem, 5vw, 3.2rem);
            margin-top: clamp(1rem, 4vw, 1.5rem);
            color: var(--secondary-color);
            text-align: center;
            display: inline-block;
        }

        .contact-sub {
            color: var(--accent-color);
            margin-top: clamp(0.25rem, 1vw, 0.375rem);
            margin-bottom: clamp(0.75rem, 2vw, 1.125rem);
            font-family: var(--font-akira);
            text-align: center;
        }

        .content { text-align: center; }

        .contact-text { 
            color: var(--secondary-color);
            line-height: 1.6;
            text-align: center;
        }

        .socials-outer {
            display: flex;
            justify-content: center;
            margin-top: clamp(1rem, 3vw, 1.5rem);
            padding: 0 clamp(0.5rem, 2vw, 0.75rem);
            width: 100%;
            box-sizing: border-box;
        }

        .socials-box {
            padding: clamp(0.75rem, 3vw, 1.25rem);
            background-color: var(--secondary-color);
            border-radius: clamp(0.5rem, 2vw, 0.75rem);
            display: flex;
            gap: clamp(0.5rem, 2vw, 1.125rem);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .social-btn {
            position: relative;
            z-index: 1;
            width: clamp(3rem, 12vw, 5.25rem);
            height: clamp(3rem, 12vw, 5.25rem);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: clamp(0.5rem, 2vw, 0.75rem);
            background: transparent;
            text-decoration: none;
            transition: transform 180ms ease;
            overflow: hidden;
            flex: 0 0 clamp(3rem, 12vw, 5.25rem);
        }

        .social-btn::before{
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            background: var(--social-hover, rgba(255,255,255,0.02));
            opacity: 0;
            transition: opacity 200ms ease;
        }

        .social-btn:hover{ transform: translateY(-2px); }

        .social-linktree { --social-hover: #00c86b; }
        .social-instagram { --social-hover: linear-gradient(135deg,#f58529 0%,#dd2a7b 50%,#515bd4 100%); }
        .social-bandcamp { --social-hover: #19819c; }
        .social-soundcloud { --social-hover: #ff5500; }
        .social-spotify { --social-hover: #1db954; }
        .social-deezer { --social-hover: #a238ff; }
        .social-ytm { --social-hover: #ff0000; }

        .social-btn img{
            position: relative;
            z-index: 2;
            width: clamp(1.75rem, 7vw, 3rem);
            height: clamp(1.75rem, 7vw, 3rem);
            object-fit: contain;
            display: block;
            transition: transform 200ms ease, filter 200ms ease;
        }

        .social-btn:hover::before {
            opacity: 1;
        }

        .mail-wrapper {
            margin-top: clamp(0.75rem, 2vw, 1.125rem);
            display: flex;
            justify-content: center;
            padding: 0 clamp(0.5rem, 2vw, 0.75rem);
            width: 100%;
            box-sizing: border-box;
        }

        .mail-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: clamp(0.5rem, 2vw, 0.75rem);
            padding: clamp(0.5rem, 2vw, 0.75rem) clamp(0.75rem, 3vw, 1.125rem);
            border-radius: clamp(0.5rem, 2vw, 0.75rem);
            background-color: var(--secondary-color);
            color: var(--primary-color);
            text-decoration: none;
            font-family: var(--font-akira);
            box-shadow: 0 0.5rem 1.125rem rgba(0,0,0,0.18);
            transition: transform 160ms ease, opacity 200ms ease;
            overflow: hidden;
            max-width: 100%;
            cursor: pointer;
            text-align: center;
            height: auto;
            min-height: clamp(2.5rem, 8vw, 3rem);
        }

        .mail-link::before{
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle at 30% 30%, rgba(255,64,64,0.18), rgba(255,64,64,0) 30%),
                radial-gradient(circle at 70% 70%, rgba(193,193,189,0.12), rgba(193,193,189,0) 35%),
                linear-gradient(180deg, rgba(43,43,43,0.12) 0%, rgba(158,157,153,0.02) 55%);
            opacity: 0;
            transition: opacity 280ms ease;
        }

        .mail-link:hover::before { opacity: 1; }
        .mail-link:hover { opacity: 0.9; }

        .mail-text{ z-index: 1; font-size: clamp(0.75rem, 2.5vw, 1rem); color: var(--primary-color); }

        /* Tablet format */
        @media (max-width: 1200px) {
            .contact-title { font-size: clamp(2rem, 8vw, 4rem); margin-top: clamp(3rem, 12vw, 8rem); }
            .contact-sub { font-size: clamp(0.9rem, 3vw, 1.4rem); }
            .socials-box { gap: clamp(0.75rem, 3vw, 1.5rem); padding: clamp(1rem, 4vw, 1.5rem); }
            .social-btn { width: clamp(4rem, 18vw, 8rem); height: clamp(4rem, 18vw, 8rem); flex: 0 0 clamp(4rem, 18vw, 8rem); border-radius: clamp(0.75rem, 3vw, 1.5rem); }
            .social-btn img { width: clamp(2.5rem, 10vw, 5rem); height: clamp(2.5rem, 10vw, 5rem); }
            .mail-link { width: 90%; padding: clamp(1rem, 4vw, 1.5rem); }
            .mail-text { font-size: clamp(1rem, 4vw, 2rem); }
        }

        /* Smartphone format */
        @media (max-width: 480px) {
            .contact-title { font-size: clamp(1.5rem, 8vw, 2.5rem); margin-top: clamp(2rem, 10vw, 4rem); }
            .social-btn { width: clamp(3rem, 20vw, 5rem); height: clamp(3rem, 20vw, 5rem); flex: 0 0 clamp(3rem, 20vw, 5rem); }
            .social-btn img { width: clamp(1.75rem, 12vw, 3rem); height: clamp(1.75rem, 12vw, 3rem); }
        }
    </style>
</head>

<body>

        <p>&copy; 2024 MNSX</p>
    </footer>

    <script>
        (function(){
            const title = document.getElementById('contactTitle');
            const box = document.getElementById('socialsBox');
            if(!title || !box) return;

            function syncWidth(){
                const isMobile = window.innerWidth <= 1200;
                const mail = document.getElementById('mailLink');

                if(isMobile){
                    const target = Math.min(window.innerWidth * 0.95, 1200); // generous width, capped to avoid overflow
                    box.style.width = target + 'px';
                    if(mail) mail.style.width = target + 'px';
                    return;
                }

                const w = Math.ceil(title.getBoundingClientRect().width);
                const min = 84; // ensure at least one button fits
                const width = Math.max(w, min);
                box.style.width = width + 'px';
                if(mail) mail.style.width = width + 'px';
            }

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(syncWidth);
            } else {
                window.addEventListener('load', syncWidth);
            }

            document.addEventListener('DOMContentLoaded', syncWidth);
            let _t;
            window.addEventListener('resize', function(){
                clearTimeout(_t);
                _t = setTimeout(syncWidth, 80);
            });
        })();
    </script>

        <script>
        (function(){
            const TRANSITION_MS = 360;
            function onReady(){ document.documentElement.classList.remove('is-loading'); void document.documentElement.offsetWidth; document.documentElement.classList.add('is-loaded'); }
            function handleClick(e){ if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return; const a=e.target.closest('a'); if(!a) return; const href=a.getAttribute('href'); if(!href) return; if(a.target&&a.target!==''||href.indexOf('mailto:')===0||href.indexOf('tel:')===0) return; if(href.startsWith('http')&&new URL(href,location.href).origin!==location.origin) return; if(href.startsWith('#')) return; const targetUrl=new URL(href,location.href).href; if(targetUrl===location.href) return; e.preventDefault(); document.documentElement.classList.add('is-exiting'); setTimeout(()=>{ location.href=targetUrl }, TRANSITION_MS+30); }
            if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', onReady); } else { onReady(); }
            document.addEventListener('click', handleClick, true);
            window.addEventListener('pageshow', function(e){ if(e.persisted){ document.documentElement.classList.remove('is-exiting'); document.documentElement.classList.remove('is-loading'); document.documentElement.classList.add('is-loaded'); } });
        })();
        </script>

        <script>
        (function(){
            const toggle=document.querySelector('.menu-toggle');
            const nav=document.getElementById('primaryNav');
            if(!toggle||!nav) return;

            function closeMenu(){
                nav.classList.remove('is-open');
                toggle.setAttribute('aria-expanded','false');
            }

            toggle.addEventListener('click',function(){
                const isOpen=nav.classList.toggle('is-open');
                toggle.setAttribute('aria-expanded',isOpen?'true':'false');
            });

            document.addEventListener('click',function(evt){
                if(!nav.classList.contains('is-open')) return;
                if(evt.target.closest('.topbar')) return;
                closeMenu();
            });

            window.addEventListener('resize',function(){ if(window.innerWidth>1200) closeMenu(); });
        })();
        </script>

</body>
