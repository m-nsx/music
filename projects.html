<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mnsx</title>
    <link rel="stylesheet" href="styles.css">
    <script>document.documentElement.classList.add('is-loading');</script>
    <style>
		.projects-title {
			font-family: var(--font-akira);
			font-size: 5rem;
			margin: 0;
			color: var(--secondary-color);
            text-align: center;
		}

		.projects-sub {
			color: var(--accent-color);
			margin-top: 6px;
			margin-bottom: 18px;
			font-family: var(--font-akira);
            font-size: 2rem;
            text-align: center;
		}

		.projects-text { 
			color: var(--secondary-color);
			line-height: 1.6;
            text-align: center;
		}

		.projects-clic {
			display: inline-block;
			color: var(--secondary-color);
			text-decoration: none;
			font-weight: 700;
			font-family: var(--font-akira);
			font-size: 2.5em;
			font-style: italic;
			transition: color 0.18s ease;	
		}

		.projects-clic:hover {
			color: var(--accent-color);
		}
  	</style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-left">
            <a class="brand" href="index.html">
                <!-- <img src="assets/img/icon.png" alt="mnsx logo" class="brand-logo"> -->
                <h1 class="brand-title">MNSX</h1>
            </a>
        </div>
        <div class="topbar-right">
            <nav>
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class = "content">
        <div style="align-items: center; display: flex; flex-direction: column; justify-content: center; height: 60vh;">
            <div class="projects-title">
                WORK IN PROGRESS
            </div>
            <div class="projects-sub" style="font-style: italic;">
                PLEASE CHECK BACK LATER
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="privacy.html">Privacy Policy</a>
        </div>
        <p>&copy; 2024 MNSX</p>
    </footer>

        <script>
        (function(){
            const TRANSITION_MS = 360;
            function onReady(){ document.documentElement.classList.remove('is-loading'); void document.documentElement.offsetWidth; document.documentElement.classList.add('is-loaded'); }
            function handleClick(e){ if(e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey) return; const a=e.target.closest('a'); if(!a) return; const href=a.getAttribute('href'); if(!href) return; if(a.target&&a.target!==''||href.indexOf('mailto:')===0||href.indexOf('tel:')===0) return; if(href.startsWith('http')&&new URL(href,location.href).origin!==location.origin) return; if(href.startsWith('#')) return; const targetUrl=new URL(href,location.href).href; if(targetUrl===location.href) return; e.preventDefault(); document.documentElement.classList.add('is-exiting'); setTimeout(()=>{ location.href=targetUrl }, TRANSITION_MS+30); }
            if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', onReady); } else { onReady(); }
            document.addEventListener('click', handleClick, true);
            window.addEventListener('pageshow', function(e){ if(e.persisted){ document.documentElement.classList.remove('is-exiting'); document.documentElement.classList.remove('is-loading'); document.documentElement.classList.add('is-loaded'); } });
        })();
        </script>

</body>
</html>
